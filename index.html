<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>geometry dash remake by thosphere ig</title>
<style>
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 50px;
  background: #111;
  font-family: Arial, sans-serif;
}
#gameContainer { position: relative; }
canvas {
  border: 3px solid #444;
  background: #222;
  display: block;
}
#progressBarBG { 
  width: 100%; height: 10px; background: #333; border-radius: 5px; 
  position: absolute; top: -20px; left: 0; 
}
#progressBarFill { 
  width: 0%; height: 100%; background: #0f0; border-radius: 5px; 
}
#restartBtn {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 20px; font-size: 18px; display: none; cursor: pointer;
}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="progressBarBG"><div id="progressBarFill"></div></div>
  <canvas id="game" width="800" height="300"></canvas>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restartBtn');
const progressFill = document.getElementById('progressBarFill');

const groundY = 260;
const player = {x: 80, y: groundY - 30, size:30, yv:0, grounded:true, alive:true};
const gravity = 0.6;
const jumpForce = -9;
let spikes = [];
const MIN_DIST = 80, MAX_DIST = 640;
let lastSpikeX = canvas.width;

let levelDuration = 60000; // 1 min
let levelStart = Date.now();
let speed = 6;

function spawnSpike() {
  const dist = MIN_DIST + Math.random()*(MAX_DIST-MIN_DIST);
  const x = Math.max(lastSpikeX + dist, canvas.width + dist);
  lastSpikeX = x;
  spikes.push({x, size:25, y:groundY - 25});
}

setInterval(spawnSpike, 1000);

let inputHeld = false;
window.addEventListener('keydown', e => { if(e.code==='Space') inputHeld=true; });
window.addEventListener('keyup', e => { if(e.code==='Space') inputHeld=false; });
canvas.addEventListener('mousedown', ()=>inputHeld=true);
canvas.addEventListener('mouseup', ()=>inputHeld=false);

restartBtn.onclick = ()=>resetGame();

function resetGame(){
  player.y = groundY - player.size;
  player.yv = 0;
  player.grounded = true;
  player.alive = true;
  spikes = [];
  lastSpikeX = canvas.width;
  levelStart = Date.now();
  restartBtn.style.display = 'none';
  requestAnimationFrame(loop);
}

function triangleCollideRect(tri,p){
  return p.x < tri.x + tri.size && p.x + p.size > tri.x &&
         p.y < tri.y + tri.size && p.y + p.size > tri.y;
}

function drawSpike(s){
  ctx.beginPath();
  ctx.moveTo(s.x, s.y + s.size);
  ctx.lineTo(s.x + s.size/2, s.y);
  ctx.lineTo(s.x + s.size, s.y + s.size);
  ctx.closePath();
  ctx.fillStyle = '#f00';
  ctx.fill();
}

function loop(){
  if(!player.alive) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle = '#444';
  ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);

  // update player
  if(inputHeld && player.grounded) player.yv = jumpForce;
  player.yv += gravity;
  player.y += player.yv;
  player.grounded = false;
  if(player.y + player.size >= groundY){ player.y = groundY - player.size; player.yv=0; player.grounded=true; }

  // update spikes
  for(let i=spikes.length-1;i>=0;i--){
    spikes[i].x -= speed;
    drawSpike(spikes[i]);
    if(triangleCollideRect(spikes[i],player)){
      player.alive=false;
      restartBtn.style.display='block';
    }
    if(spikes[i].x + spikes[i].size < 0) spikes.splice(i,1);
  }

  // draw player
  ctx.fillStyle='#0ff';
  ctx.fillRect(player.x,player.y,player.size,player.size);

  // progress
  const prog = Math.min((Date.now()-levelStart)/levelDuration,1);
  progressFill.style.width = (prog*100)+'%';

  if(prog>=1){
    player.alive=false;
    restartBtn.style.display='block';
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
