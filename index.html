<html lang="en">
<head>
<meta charset="UTF-8">
<title>algebra dash (thosphere's geometry dash remake)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    background: #111;
    margin: 0 auto;
  }
  #progressContainer {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 12px;
    background: #555;
    border-radius: 6px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0;
    background: #0f0;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div id="progressContainer">
  <div id="progressBar"></div>
</div>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const JUMP = -12;
let speed = 5.3;
let distance = 0;
let gameOver = false;

const player = {
  x: 100,
  y: canvas.height - 50,
  size: 30,
  dy: 0,
  rotation: 0
};

let obstacles = [];
let lastObstacleX = 0;

function spawnObstacle() {
  const spikeHeight = 40;
  const spikeWidth = 40;
  let gap = Math.random() * 200 + 300;
  const x = Math.max(canvas.width + gap, lastObstacleX + 300);
  obstacles.push({
    x: x,
    y: canvas.height - spikeHeight,
    width: spikeWidth,
    height: spikeHeight
  });
  lastObstacleX = x;
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && player.y + player.size >= canvas.height) {
    player.dy = JUMP;
  }
});

         rect.y + rect.size > triBox.y;
}
