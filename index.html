<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Dash Remake by Thosphere IG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    background: #111;
    margin: 0 auto;
  }
  #progressContainer {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 80%;
    height: 10px;
    background: #555;
  }
  #progressBar {
    height: 100%;
    width: 0;
    background: #0f0;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div id="progressContainer">
  <div id="progressBar"></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.7;
const JUMP = -15; // slightly higher jump
let speed = 4;
let distance = 0;
let gameOver = false;

// Player
const player = {
  x: 100,
  y: canvas.height - 50,
  size: 30,
  dy: 0,
  rotation: 0
};

// Obstacles (triangle spikes)
let obstacles = [];
function spawnObstacle() {
  const spikeHeight = 40;
  const spikeWidth = 40;

  // Decide number of spikes: 1, 2, or 3
  const rand = Math.random();
  let spikes = 1;
  if (rand < 0.3) spikes = 3;
  else if (rand < 0.6) spikes = 2;

  for (let i = 0; i < spikes; i++) {
    const gap = Math.random() * 50 + 50; // random spacing for multi spikes
    obstacles.push({
      x: canvas.width + i * (spikeWidth + gap),
      y: canvas.height - spikeHeight,
      width: spikeWidth,
      height: spikeHeight
    });
  }
}

// Controls
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && player.y + player.size >= canvas.height) {
    player.dy = JUMP;
  }
});

// Collision detection
function checkCollision(rect, tri) {
  const triBox = {x: tri.x, y: tri.y, width: tri.width, height: tri.height};
  return rect.x < triBox.x + triBox.width &&
         rect.x + rect.size > triBox.x &&
         rect.y < triBox.y + triBox.height &&
         rect.y + rect.size > triBox.y;
}

// Draw triangle spike
function drawTriangle(tri) {
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.moveTo(tri.x, tri.y + tri.height);
  ctx.lineTo(tri.x + tri.width/2, tri.y);
  ctx.lineTo(tri.x + tri.width, tri.y + tri.height);
  ctx.closePath();
  ctx.fill();
}

// Game loop
function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Update player
  player.dy += GRAVITY;
  player.y += player.dy;

  if (player.y + player.size > canvas.height) {
    player.y = canvas.height - player.size;
    player.dy = 0;
  }

  // Draw spinning player
  player.rotation += 0.2;
  ctx.save();
  ctx.translate(player.x + player.size/2, player.y + player.size/2);
  ctx.rotate(player.rotation);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
  ctx.restore();

  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed;
    drawTriangle(obstacles[i]);

    if (checkCollision(player, obstacles[i])) {
      gameOver = true;
      alert("Game Over!");
      location.reload();
    }

    if (obstacles[i].x + obstacles[i].width < 0) {
      obstacles.splice(i,1);
    }
  }

  // Spawn obstacles randomly
  if (Math.random() < 0.02) spawnObstacle();

  // Update distance and progress
  distance += speed;
  const progress = Math.min(distance / 2000, 1);
  document.getElementById('progressBar').style.width = (progress * 100) + '%';

  requestAnimationFrame(update);
}

// Start game
update();
</script>
</body>
</html>
