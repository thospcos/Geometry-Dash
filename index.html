<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Geometry Dash HTML</title>
<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 60px;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        user-select: none;
    }
    #gameContainer {
        position: relative;
    }
    canvas {
        background: #222;
        display: block;
        border: 4px solid #444;
        border-radius: 8px;
    }
    #progressBarBG {
        width: 100%;
        height: 10px;
        background: #333;
        position: absolute;
        top: -20px;
        left: 0;
        border-radius: 5px;
    }
    #progressBarFill {
        height: 10px;
        width: 0%;
        background: #0f0;
        border-radius: 5px;
    }
    #nextLevelBtn, #restartBtn {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 25px;
        background: #fff;
        color: #000;
        font-size: 20px;
        border: none;
        border-radius: 8px;
        display: none;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="gameContainer">
    <div id="progressBarBG"><div id="progressBarFill"></div></div>
    <canvas id="game" width="800" height="300"></canvas>
    <button id="restartBtn">Restart</button>
    <button id="nextLevelBtn">Play Next Level</button>
</div>
<script>
// CANVAS SETUP
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");
const nextLevelBtn = document.getElementById("nextLevelBtn");
const progressFill = document.getElementById("progressBarFill");

let level = 1;
let levelDuration = 120000; // 2 minutes
let levelStartTime = 0;
let speed = 6;

let player, obstacles, spikes;
let gameOver = false;
let jumpHeld = false;
let gravity = 0.6;
let spinSpeed = 12;

function resetGame(startNewLevel = false) {
    if (startNewLevel) level++;

    speed = 6 + (level - 1) * 0.5;

    player = {
        x: 80,
        y: 220,
        size: 30,
        yv: 0,
        grounded: false,
        rotation: 0
    };

    obstacles = [];
    spikes = [];
    gameOver = false;
    restartBtn.style.display = "none";
    nextLevelBtn.style.display = "none";
    progressFill.style.width = "0%";

    levelStartTime = Date.now();
}

function spawnObstacle() {
    const isWide = Math.random() < 0.7;
    const width = isWide ? 120 + Math.random() * 80 : 40;
    const height = 40;
    const x = canvas.width + Math.random() * 400;

    obstacles.push({ x, y: 260 - height, w: width, h: height });

    if (Math.random() < 0.5) {
        spikes.push({ x: x + width / 2 - 10, y: 260 - height - 20, w: 20, h: 20 });
    }
}

setInterval(spawnObstacle, 900);

window.addEventListener("keydown", e => {
    if (e.code === "Space") jumpHeld = true;
});
window.addEventListener("keyup", e => {
    if (e.code === "Space") jumpHeld = false;
});
canvas.addEventListener("mousedown", () => jumpHeld = true);
canvas.addEventListener("mouseup", () => jumpHeld = false);

function update() {
    if (gameOver) return;

    let timePassed = Date.now() - levelStartTime;
    let prog = Math.min(timePassed / levelDuration, 1);
    progressFill.style.width = (prog * 100) + "%";

    if (prog >= 1) {
        nextLevelBtn.style.display = "block";
        gameOver = true;
        return;
    }

    player.yv += gravity;

    if (jumpHeld && player.grounded) player.yv = -12;

    player.y += player.yv;

    player.grounded = false;
    if (player.y + player.size >= 260) {
        player.y = 260 - player.size;
        player.yv = 0;
        player.grounded = true;
    }

    player.rotation += spinSpeed * 0.05;

    for (let ob of obstacles) {
        ob.x -= speed;
        if (rectCollision(player, ob)) {
            if (player.y + player.size - player.yv <= ob.y) {
                player.y = ob.y - player.size;
                player.yv = 0;
                player.grounded = true;
            } else death();
        }
    }

    for (let sp of spikes) {
        sp.x -= speed;
        if (rectCollision(player, sp)) death();
    }

    obstacles = obstacles.filter(o => o.x + o.w > 0);
    spikes = spikes.filter(s => s.x + s.w > 0);

    draw();
    requestAnimationFrame(update);
}

function rectCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.size > b.x && a.y < b.y + b.h && a.y + a.size > b.y;
}

function death() {
    gameOver = true;
    restartBtn.style.display = "block";
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#444";
    ctx.fillRect(0, 260, canvas.width, 40);

    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate(player.rotation);
    ctx.fillStyle = "#0ff";
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.restore();

    ctx.fillStyle = "#888";
    for (let ob of obstacles) ctx.fillRect(ob.x, ob.y, ob.w, ob.h);

    ctx.fillStyle = "#f00";
    for (let sp of spikes) ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
}

restartBtn.onclick = () => resetGame(false);
nextLevelBtn.onclick = () => resetGame(true);

resetGame();
update();
</script>
</body>
</html>
