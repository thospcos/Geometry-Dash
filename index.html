<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>geometry dash remake by thosphere ig</title>
<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 60px;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        user-select: none;
    }
    #gameContainer { position: relative; }
    canvas {
        background: #222;
        display: block;
        border: 4px solid #444;
        border-radius: 8px;
    }
    #progressBarBG {
        width: 100%; height: 10px;
        background: #333;
        position: absolute;
        top: -20px; left: 0;
        border-radius: 5px;
    }
    #progressBarFill {
        height: 10px; width: 0%;
        background: #0f0;
        border-radius: 5px;
    }
    #nextLevelBtn, #restartBtn {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 25px;
        background: #fff; border: none;
        color: #000; font-size: 20px;
        border-radius: 8px; display: none;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="gameContainer">
    <div id="progressBarBG"><div id="progressBarFill"></div></div>
    <canvas id="game" width="800" height="300"></canvas>
    <button id="restartBtn">Restart</button>
    <button id="nextLevelBtn">Play Next Level</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");
const nextLevelBtn = document.getElementById("nextLevelBtn");
const progressFill = document.getElementById("progressBarFill");

let level = 1;
let levelDuration = 110000;
let levelStartTime = 0;
let speed = 6;
let gravity = 0.5;
let spinSpeed = 0.25;
let jumpForce = -9;

let player, obstacles, spikes;
let gameOver = false;
let jumpHeld = false;

function resetGame(startNewLevel = false) {
    if (startNewLevel) level++;
    speed = 6 + (level - 1) * 0.5;

    player = { x: 80, y: 220, size: 30, yv: 0, grounded: false, rotation: 0 };

    obstacles = [];
    spikes = [];
    gameOver = false;
    restartBtn.style.display = "none";
    nextLevelBtn.style.display = "none";
    progressFill.style.width = "0%";
    levelStartTime = Date.now();
}

function // ONLY SPIKES — NO OBSTACLES
function spawnObstacle() {
    const minDist = 80;  // ~1 meter
    const maxDist = 640; // ~8 meters

    const x = canvas.width + minDist + Math.random() * (maxDist - minDist);
    const size = 25;
    const y = 260 - size;

    spikes.push({ x, y, size });
}
setInterval(spawnObstacle, 600);(spawnObstacle, 1200);

window.addEventListener("keydown", e => { if (e.code === "Space") jumpHeld = true; });
window.addEventListener("keyup", e => { if (e.code === "Space") jumpHeld = false; });
canvas.addEventListener("mousedown", () => jumpHeld = true);
canvas.addEventListener("mouseup", () => jumpHeld = false);

function update() {
    if (gameOver) return;

    let prog = Math.min((Date.now() - levelStartTime) / levelDuration, 1);
    progressFill.style.width = (prog*100) + "%";
    if (prog >= 1) { nextLevelBtn.style.display = "block"; gameOver = true; return; }

    player.yv += gravity;
    if (jumpHeld && player.grounded) player.yv = jumpForce;
    player.y += player.yv;
    player.grounded = false;

    if (player.y + player.size >= 260) {
        player.y = 260 - player.size;
        player.yv = 0;
        player.grounded = true;
    }

    if (!player.grounded) player.rotation += spinSpeed;

    for (let ob of obstacles) {
        ob.x -= speed;
        if (rect(player, ob)) {
            if (player.y + player.size - player.yv <= ob.y) {
                player.y = ob.y - player.size;
                player.yv = 0;
                player.grounded = true;
            } else die();
        }
    }

    for (let sp of spikes) {
        sp.x -= speed;
        if (triCollide(player, sp)) die();
    }

    obstacles = obstacles.filter(o=>o.x + o.w > 0);
    spikes = spikes.filter(s=>s.x + s.size > 0);

    draw();
    requestAnimationFrame(update);
}

function rect(a,b){ return a.x < b.x+b.w && a.x+a.size>b.x && a.y<b.y+b.h && a.y+a.size>b.y; }

function triCollide(p, sp) {
    return p.x < sp.x + sp.size && p.x + p.size > sp.x && p.y < sp.y + sp.size && p.y + p.size > sp.y;
}

function die(){ gameOver = true; restartBtn.style.display = "block"; }

function drawTriangle(x,y,size){
    ctx.beginPath();
    ctx.moveTo(x, y+size);
    ctx.lineTo(x+size/2, y);
    ctx.lineTo(x+size, y+size);
    ctx.closePath();
    ctx.fill();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#444";
    ctx.fillRect(0,260,canvas.width,40);

    ctx.save();
    ctx.translate(player.x+player.size/2, player.y+player.size/2);
    ctx.rotate(player.rotation);
    ctx.fillStyle="#0ff";
    ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
    ctx.restore();

    ctx.fillStyle="#888";
    obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

    ctx.fillStyle="#f00";
    spikes.forEach(s=>drawTriangle(s.x, s.y, s.size));
}

restartBtn.onclick = ()=>resetGame(false);
nextLevelBtn.onclick = ()=>resetGame(true);

resetGame(); update();
</script>
</body>
</html>
