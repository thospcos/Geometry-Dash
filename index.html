<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>algebra dash (thosphere's geometry dash remake)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    overflow: hidden;
    font-family: sans-serif;
    color: #fff;
  }
  canvas {
    display: block;
    background: #111;
    margin: 0 auto;
  }
  #progressContainer {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 12px;
    background: #555;
    border-radius: 6px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0;
    background: #0f0;
  }
  #restartBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 32px;
    font-size: 20px;
    background: #0f0;
    color: #111;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div id="progressContainer">
  <div id="progressBar"></div>
</div>
<button id="restartBtn">Restart</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.8;
const JUMP = -15;
let speed = 7;
let distance = 0;
let gameOver = false;

const player = {
  x: 100,
  y: canvas.height - 50,
  size: 50,
  dy: 0,
  rotation: 0
};

let obstacles = [];
let lastObstacleX = 0;

function spawnObstacle() {
  const spikeHeight = 40;
  const spikeWidth = 40;
  let gap = Math.random() * 200 + 300;
  const x = Math.max(canvas.width + gap, lastObstacleX + 300);
  obstacles.push({
    x: x,
    y: canvas.height - spikeHeight,
    width: spikeWidth,
    height: spikeHeight
  });
  lastObstacleX = x;
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && player.y + player.size >= canvas.height) {
    player.dy = JUMP;
  }
});

function checkCollision(rect, tri) {
  const triBox = {x: tri.x, y: tri.y, width: tri.width, height: tri.height};
  return rect.x < triBox.x + triBox.width &&
         rect.x + rect.size > triBox.x &&
         rect.y < triBox.y + triBox.height &&
         rect.y + rect.size > triBox.y;
}

function drawTriangle(tri) {
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.moveTo(tri.x, tri.y + tri.height);
  ctx.lineTo(tri.x + tri.width/2, tri.y);
  ctx.lineTo(tri.x + tri.width, tri.y + tri.height);
  ctx.closePath();
  ctx.fill();
}

function endGame() {
  gameOver = true;
  document.getElementById('restartBtn').style.display = 'block';
}

document.getElementById('restartBtn').addEventListener('click', () => {
  obstacles = [];
  distance = 0;
  player.y = canvas.height - player.size;
  player.dy = 0;
  player.rotation = 0;
  lastObstacleX = 0;
  gameOver = false;
  document.getElementById('restartBtn').style.display = 'none';
  update();
});

function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  player.dy += GRAVITY;
  player.y += player.dy;

  if (player.y + player.size > canvas.height) {
    player.y = canvas.height - player.size;
    player.dy = 0;
  }

  if (player.dy !== 0) {
    player.rotation += 0.2;
  } else {
    player.rotation = 0;
  }

  ctx.save();
  ctx.translate(player.x + player.size/2, player.y + player.size/2);
  ctx.rotate(player.rotation);
  ctx.fillStyle = '#0ff';
  ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
  ctx.restore();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed;
    drawTriangle(obstacles[i]);

    if (checkCollision(player, obstacles[i])) {
      endGame();
    }

    if (obstacles[i].x + obstacles[i].width < 0) {
      obstacles.splice(i,1);
    }
  }

  if (obstacles.length === 0 || canvas.width - obstacles[obstacles.length-1].x > 300) {
    if (Math.random() < 0.02) spawnObstacle();
  }

  distance += speed;
  const progress = Math.min(distance / 2000, 1);
  document.getElementById('progressBar').style.width = (progress * 100) + '%';

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
