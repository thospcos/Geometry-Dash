<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>geometry dash remake by thosphere ig</title>
<style>
  body {
    margin: 0;
    background: #06111d;
    display: flex;
    justify-content: center;
    padding-top: 60px;
    font-family: Arial, sans-serif;
  }
  .wrapper {
    width: 960px;
    text-align: center;
  }
  canvas {
    width: 100%;
    height: 450px;
    background: #0a1a2c;
    border-radius: 12px;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    padding: 12px 20px;
    font-size: 20px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrapper">
  <canvas id="game" width="900" height="450"></canvas>
  <div id="overlay"></div>
</div>
<script>
// BASIC SETUP
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

const W = 900, H = 450;
canvas.width = W;
canvas.height = H;

// PLAYER
const player = {
  x: 120,
  y: H - 90,
  size: 40,
  vy: 0,
  gravity: 1.05,
  jumpForce: -17,
  grounded: true,
  rotation: 0,
  alive: true
};

// LEVEL SYSTEM
let level = 1;
let levelLength = 60 * 60 * 1.2; // 1.2 minutes
let levelProgress = 0;

// GAME
let gameSpeed = 6.5;
let obstacles = [];
let inputHeld = false;

function jump(){
  if (!player.alive) return;
  if (player.grounded){
    player.vy = player.jumpForce;
    player.grounded = false;
  }
}

window.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});
canvas.addEventListener("mousedown", jump);
canvas.addEventListener("touchstart", e => { e.preventDefault(); jump(); });

// OBSTACLE GENERATION
function spawnObstacle(){
  const gap = 200 + Math.random()*200;
  const x = W + gap;

  // 50% spike, 50% block you can stand on
  if(Math.random() < 0.5){
    const w = 40;
    const h = 40;
    obstacles.push({type: "spike", x, y: H - 50, w, h});
  } else {
    const w = 60 + Math.random()*40;
    const h = 40 + Math.random()*20;
    obstacles.push({type: "block", x, y: H - 50 - h, w, h});
  }
}

let spawnTimer = 0;

function update(){
  if (!player.alive) return;

  spawnTimer++;
  if (spawnTimer > 70){
    spawnObstacle();
    spawnTimer = 0;
  }

  // PLAYER PHYSICS
  player.vy += player.gravity;
  player.y += player.vy;

  // FLOOR
  if(player.y + player.size >= H - 50){
    player.y = H - 50 - player.size;
    player.vy = 0;
    player.grounded = true;
  }

  // ROTATION - ALWAYS FORWARD (no reversing)
  if (!player.grounded)
    player.rotation += 0.25;
  else
    player.rotation = 0;

  // MOVE OBSTACLES
  obstacles.forEach(ob => ob.x -= gameSpeed);
  obstacles = obstacles.filter(ob => ob.x + ob.w > -20);

  // COLLISION HANDLING
  obstacles.forEach(ob => {
    const px = player.x;
    const py = player.y;
    const ps = player.size;

    if(ob.type === "spike"){
      if(px < ob.x + ob.w && px + ps > ob.x && py < ob.y + ob.h && py + ps > ob.y){
        die();
      }
    } else {
      // BLOCKS — PLAYER CAN STAND ON THEM
      if(px < ob.x + ob.w && px + ps > ob.x){
        // from above
        if(py + ps > ob.y && py + ps < ob.y + ob.h + 20 && player.vy > 0){
          player.y = ob.y - ps;
          player.vy = 0;
          player.grounded = true;
        }
      }
    }
  });

  // LEVEL PROGRESSION
  levelProgress++;
  if(levelProgress >= levelLength){
    winLevel();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle = "#081a2e";
  ctx.fillRect(0,0,W,H);

  // ground
  ctx.fillStyle = "#0d2239";
  ctx.fillRect(0,H-50,W,50);

  // obstacles
  obstacles.forEach(ob => {
    if(ob.type === "spike"){
      ctx.fillStyle = "#ff4444";
      ctx.beginPath();
      ctx.moveTo(ob.x, ob.y + ob.h);
      ctx.lineTo(ob.x + ob.w/2, ob.y);
      ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
      ctx.fill();
    } else {
      ctx.fillStyle = "#456";
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
    }
  });

  // player
  ctx.save();
  ctx.translate(player.x + player.size/2, player.y + player.size/2);
  ctx.rotate(player.rotation);
  ctx.fillStyle = "#0ff";
  ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
  ctx.restore();
}

function loop(){
  update();
  draw();
  if(player.alive) requestAnimationFrame(loop);
}

function die(){
  player.alive = false;
  showMessage("You Died", "Restart", () => restart());
}

function winLevel(){
  player.alive = false;
  showMessage("Level Complete!", "Play Next Level", () => nextLevel());
}

function restart(){
  obstacles = [];
  player.y = H - 90;
  player.vy = 0;
  player.alive = true;
  levelProgress = 0;
  overlay.innerHTML = "";
  loop();
}

function nextLevel(){
  level++;
  obstacles = [];
  player.y = H - 90;
  player.vy = 0;
  player.alive = true;
  levelProgress = 0;
  levelLength = 60 * 60 * 1.2; // each level same duration
  gameSpeed += 0.5; // faster each level
  overlay.innerHTML = "";
  loop();
}

function showMessage(title, button, callback){
  overlay.innerHTML = `
    <div style="pointer-events:auto; text-align:center;">
      <div style="font-size:28px; margin-bottom:15px; color:white;">${title}</div>
      <button class="btn">${button}</button>
    </div>`;
  overlay.querySelector("button").onclick = callback;
}

restart();
</script>
</body>
</html>
