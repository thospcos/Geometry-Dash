<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algebra Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
    font-family: sans-serif;
    color: #fff;
    overflow: hidden;
    flex-direction: column;
  }
  #title {
    font-size: 24px;
    margin-bottom: 10px;
    color: #0ff;
    font-weight: bold;
  }
  #timer {
    font-size: 16px;
    margin-bottom: 5px;
    color: #0f0;
  }
  #gameContainer {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  canvas { background: #111; display: block; }
  #progressContainer {
    margin-top: 10px;
    width: 70%;
    height: 5px;
    background: #555;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0;
    background: #0f0;
    transition: width 0.3s linear;
  }
  #restartBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 24px;
    font-size: 18px;
    background: #0f0;
    color: #111;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>
<div id="title">Algebra Dash (Thosphere's GD Remake)</div>
<div id="timer">Time: 0.0 s</div>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div id="progressContainer"><div id="progressBar"></div></div>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerDisplay = document.getElementById('timer');

const GRAVITY = 0.8;
const JUMP = -14;
let speed = 7;
let distance = 0;
let gameOver = false;
let startTime = Date.now();

const player = { x:100, y:canvas.height-50, size:50, dy:0, rotation:0 };
let obstacles = [];
let lastObstacleX = 0;

function spawnObstacle() {
  const spikeHeight = 40;
  const spikeWidth = 40;
  let gap = Math.random() * 200 + 200;
  const x = Math.max(canvas.width + gap, lastObstacleX + 200);
  obstacles.push({ x:x, y:canvas.height - spikeHeight, width:spikeWidth, height:spikeHeight });
  lastObstacleX = x;
}

document.addEventListener('keydown', e => {
  if(e.code==='Space' && player.y+player.size >= canvas.height) player.dy = JUMP;
});

// Improved triangle collision
function checkCollision(rect, tri) {
  const px = rect.x, py = rect.y, ps = rect.size;
  const ax = tri.x + tri.width/2, ay = tri.y;
  const bx = tri.x, by = tri.y + tri.height;
  const cx = tri.x + tri.width, cy = tri.y + tri.height;

  const corners = [ {x:px, y:py+ps}, {x:px+ps, y:py+ps} ];
  for(let corner of corners){
    const v0x = cx - ax, v0y = cy - ay;
    const v1x = bx - ax, v1y = by - ay;
    const v2x = corner.x - ax, v2y = corner.y - ay;
    const dot00 = v0x*v0x + v0y*v0y;
    const dot01 = v0x*v1x + v0y*v1y;
    const dot02 = v0x*v2x + v0y*v2y;
    const dot11 = v1x*v1x + v1y*v1y;
    const dot12 = v1x*v2x + v1y*v2y;
    const invDenom = 1 / (dot00*dot11 - dot01*dot01);
    const u = (dot11*dot02 - dot01*dot12) * invDenom;
    const v = (dot00*dot12 - dot01*dot02) * invDenom;
    if(u>=0 && v>=0 && u+v<=1) return true;
  }
  return false;
}

function drawTriangle(tri){
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.moveTo(tri.x, tri.y + tri.height);
  ctx.lineTo(tri.x + tri.width/2, tri.y);
  ctx.lineTo(tri.x + tri.width, tri.y + tri.height);
  ctx.closePath();
  ctx.fill();
}

function endGame(){
  gameOver=true;
  document.getElementById('restartBtn').style.display='block';
}

document.getElementById('restartBtn').addEventListener('click',()=>{
  obstacles=[];
  distance=0;
  player.y=canvas.height-player.size;
  player.dy=0;
  player.rotation=0;
  lastObstacleX=0;
  gameOver=false;
  startTime = Date.now();
  document.getElementById('restartBtn').style.display='none';
  update();
});

function update(){
  if(gameOver) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  player.dy += GRAVITY;
  player.y += player.dy;

  if(player.y + player.size > canvas.height){
    player.y = canvas.height - player.size;
    player.dy = 0;
  }

  player.rotation = player.dy!==0 ? player.rotation+0.2 : 0;

  ctx.save();
  ctx.translate(player.x+player.size/2, player.y+player.size/2);
  ctx.rotate(player.rotation);
  ctx.fillStyle='#0ff';
  ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
  ctx.restore();

  for(let i=obstacles.length-1;i>=0;i--){
    obstacles[i].x -= speed;
    drawTriangle(obstacles[i]);
    if(checkCollision(player,obstacles[i])) endGame();
    if(obstacles[i].x + obstacles[i].width <0) obstacles.splice(i,1);
  }

  if(obstacles.length===0 || canvas.width - obstacles[obstacles.length-1].x > 200)
    if(Math.random()<0.02) spawnObstacle();

  distance += speed;
  const slowProgress = Math.min(distance/10000,1);
  document.getElementById('progressBar').style.width = (slowProgress*100)+'%';

  // Update timer
  const elapsed = ((Date.now() - startTime)/1000).toFixed(1);
  timerDisplay.textContent = "Time: " + elapsed + " s";

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
