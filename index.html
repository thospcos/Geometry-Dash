<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geometry Dash HTML</title>
  <style>
    body {
      margin: 0;
      background: #0e0e0e;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      background: #1a1a1a;
      margin: 0 auto;
    }
    #restartBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: #ffffff15;
      border: 1px solid #ffffff33;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    #restartBtn:hover {
      background: #ffffff22;
    }
  </style>
</head>
<body>

<button id="restartBtn">Restart</button>
<canvas id="game" width="900" height="400"></canvas>

<script>
// =============================
// BASIC VARIABLE SETUP
// =============================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");

let player = {
  x: 80,
  y: 300,
  size: 40,
  vy: 0,
  gravity: 0.8,
  jumpForce: -14,
  rotating: 0
};

let groundY = 350;
let obstacles = [];
let gameSpeed = 6;
let gameRunning = true;
let spaceHeld = false;

// =============================
// INPUT HANDLING
// =============================
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    spaceHeld = true;
    jump();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") spaceHeld = false;
});

restartBtn.onclick = () => resetGame();

// =============================
// SPAWN PROCEDURAL OBSTACLES
// =============================
function spawnObstacle() {
  let height = 40 + Math.random() * 60;
  obstacles.push({
    x: canvas.width + 50,
    y: groundY - height,
    w: 30,
    h: height,
  });
}
setInterval(() => {
  if (gameRunning) spawnObstacle();
}, 900);

// =============================
// PLAYER JUMP + PHYSICS
// =============================
function jump() {
  if (player.y >= groundY - player.size - 1) {
    player.vy = player.jumpForce;
  }
}

// =============================
// COLLISION DETECTION
// =============================
function isColliding(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.size > b.x &&
    a.y < b.y + b.h &&
    a.y + a.size > b.y
  );
}

// =============================
// GAME RESET
// =============================
function resetGame() {
  player.y = groundY - player.size;
  player.vy = 0;
  obstacles = [];
  gameRunning = true;
}

// =============================
// MAIN GAME LOOP
// =============================
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameRunning) {
    // Gravity
    player.vy += player.gravity;
    player.y += player.vy;

    if (player.y >= groundY - player.size) {
      player.y = groundY - player.size;
      player.vy = 0;
    }

    // Rotate exactly like GD
    if (player.y < groundY - player.size) player.rotating += 0.2;
    else player.rotating = 0;

    // Move obstacles
    obstacles.forEach((ob) => {
      ob.x -= gameSpeed;

      if (isColliding({ x: player.x, y: player.y, size: player.size }, ob)) {
        gameRunning = false;
      }
    });

    // Remove off-screen obstacles
    obstacles = obstacles.filter((ob) => ob.x + ob.w > 0);
  }

  // =============================
  // DRAW PLAYER WITH ROTATION
  // =============================
  ctx.save();
  ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
  ctx.rotate(player.rotating);
  ctx.fillStyle = "cyan";
  ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
  ctx.restore();

  // Draw ground
  ctx.fillStyle = "#444";
  ctx.fillRect(0, groundY, canvas.width, 4);

  // Draw obstacles
  ctx.fillStyle = "#ff4444";
  obstacles.forEach((ob) => ctx.fillRect(ob.x, ob.y, ob.w, ob.h));

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
